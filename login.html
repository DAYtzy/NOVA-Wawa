<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("nova_theme");if(t)document.documentElement.setAttribute("data-theme",t);var a=localStorage.getItem("nova_theme_acc"),a2=localStorage.getItem("nova_theme_acc2");if(a)document.documentElement.style.setProperty("--c-acc",a);if(a2)document.documentElement.style.setProperty("--c-acc2",a2);}catch(e){}</script>
<meta name="theme-color" content="#0a0a12">
<title>Masuk - NOVA WAWA</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<main class="center">
  <div class="vbox"><video id="lv" muted loop playsinline preload="metadata" poster="logo.png" aria-label="Video NOVA WAWA"><source src="login.mp4" type="video/mp4"></video></div>
  <section class="card">
    <div class="tabs">
      <button class="tab active" data-tab="login">Masuk</button>
      <button class="tab" data-tab="register">Daftar</button>
    </div>
    <p id="msg" class="msg" role="alert"></p>

    <form id="login-form">
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Masuk</button>
      <a href="forgot.html" class="link">Lupa password?</a>
    </form>

    <form id="register-form" hidden>
      <label>Nama Lengkap<input name="full_name" required maxlength="100"></label>
      <label>Tahun Lahir<input type="number" name="birth_year" inputmode="numeric" placeholder="2000" required></label>
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Password (min. 8 karakter)<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
      <label class="chk"><input type="checkbox" name="agree" required><span>Saya setuju dengan <a href="terms.html" target="_blank" rel="noopener">Syarat Penggunaan</a> dan <a href="privacy.html" target="_blank" rel="noopener">Kebijakan Privasi</a>.</span></label>
      <button class="btn" type="submit">Buat akun</button>
    </form>
  </section>
  <a href="index.html" class="link">Kembali</a>
  <p class="legal-links"><a href="terms.html">Syarat</a> · <a href="privacy.html">Privasi</a></p>
</main>
<script src="script.js"></script>
</body>
</html>
